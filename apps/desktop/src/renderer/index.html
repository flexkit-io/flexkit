<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- electron-vite emits relative asset URLs; the Studio's routes are paths
         (/<projectId>/desk), so they must resolve from the root. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: ws://localhost:5173; worker-src 'self' blob:; frame-src https:; object-src 'none'; base-uri 'self'"
    />
    <title>Flexkit Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
